[package]
name = "keepass-ng"
description = "KeePass .kdbx database file parser with ehancements"
edition = "2024"

homepage = "https://github.com/ssrlive/keepass-ng"
repository = "https://github.com/ssrlive/keepass-ng"
documentation = "https://docs.rs/keepass-ng"

version = "0.10.6"
authors = [
  "Stefan Seemayer <stefan@seemayer.de>",
  "ssrlive",
  "Anssi Piirainen <iki@iki.fi>",
]
license = "MIT"

readme = "README.md"

include = ["src/", "README.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
# parse a KeePass database and output as a JSON document
name = "kp-dump-json"
required-features = ["utilities"]

[[bin]]
# decrypt a KeePass database and output the inner XML document
name = "kp-dump-xml"
required-features = ["utilities"]

[[bin]]
# Purge the history items in the Database entries
name = "kp-purge-history"
required-features = ["utilities", "save_kdbx4"]

[[bin]]
# decrypt a KeePass database and show the contained data
name = "kp-show-db"
required-features = ["utilities"]

[[bin]]
# decrypt a KeePass database and show the TOTP value for an entry
name = "kp-show-otp"
required-features = ["utilities"]

[[bin]]
# get the version of a KeePass database file
name = "kp-get-version"
required-features = ["utilities"]

[[bin]]
# parse and write a KeePass database (to check if all fields are kept)
name = "kp-rewrite"
required-features = ["utilities", "save_kdbx4"]

[[bin]]
name = "kp-yk-add"
required-features = ["utilities", "save_kdbx4", "challenge_response"]

[[bin]]
name = "kp-yk-remove"
required-features = ["utilities", "save_kdbx4", "challenge_response"]

[[bin]]
name = "kp-yk-recover"
required-features = ["utilities", "save_kdbx4", "challenge_response"]

[features]
utilities = ["clap", "rpassword", "serialization", "totp"]
serialization = ["serde_json", "chrono/serde"]
totp = ["totp-lite", "url", "base32"]
save_kdbx4 = []
challenge_response = ["sha1", "dep:challenge_response"]
merge = []

# default = ["utilities", "save_kdbx4", "challenge_response", "merge"]

[dependencies]
aes = "0.9.2"
base32 = { version = "0.5.1", optional = true }
base64 = "0.23.1"
block-modes = "0.9.1"
byteorder = "1.5.0"
cbc = "0.2.1"
chacha20 = "0.10.1"
challenge_response = { version = "0.5.46", optional = true, default-features = false, features = [
  "rusb",
] }
chrono = { version = "0.4.45", default-features = false, features = [
  "serde",
  "clock",
  "std",
] }
cipher = { version = "0.5.2", features = ["alloc", "block-padding"] }
clap = { version = "4.6.6", optional = true, features = ["derive"] }
flate2 = "1.1.9"
getrandom = { version = "0.4.3", features = ["std", "wasm_js"] }
hex = { version = "0.4.3" }
hex-literal = "1.1.0"
hmac = "0.13.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rpassword = { version = "7.5.4", optional = true }
rust-argon2 = "3.0.0"
salsa20 = "0.11.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
sha1 = { version = "0.11.0", optional = true }
sha2 = "0.11.0"
thiserror = "2.0.20"
totp-lite = { version = "2.0.1", optional = true }
twofish = "0.8.0"
url = { version = "2.5.8", optional = true }
uuid = { version = "1.24.0", features = ["v4", "serde", "js"] }
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

# Browser-only deps: wasm32-unknown-unknown is the canonical browser target.
# wasi-flavoured wasm32 targets (wasm32-wasip1, wasm32-wasip2) use their own
# backends in getrandom/uuid and cannot resolve js-sys' wasm-bindgen
# placeholder imports, so they must NOT pull these in.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3.104"

[dev-dependencies]
rand = "0.10.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.27.0"
test-with = { version = "0.17.0", default-features = false, features = [
  "executable",
] }
